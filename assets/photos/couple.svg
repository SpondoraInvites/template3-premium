<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="Placeholder artwork — the couple">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b130f"/>
      <stop offset="1" stop-color="#2b0a08"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7e5ab"/>
      <stop offset="0.4" stop-color="#e8c476"/>
      <stop offset="0.64" stop-color="#c9993f"/>
      <stop offset="1" stop-color="#a3762c"/>
    </linearGradient>
    <g id="paisley">
      <path d="M26 3 C34 8 38 17 36 26 C33.5 38 24 46 13.5 43 C4 40.5 0 30 5.5 21.5 C9.5 15.5 17 15 20.5 20 C18 15.5 20 9 26 3 Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M22 12 C15 17 12.5 25 16 31 C19 35.5 25 34 25 29 C25 25 21.5 24 20 26.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      <circle cx="29" cy="21" r="1.7" fill="currentColor"/><circle cx="13" cy="30" r="1.2" fill="currentColor"/>
    </g>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect x="26" y="26" width="1148" height="698" fill="none" stroke="#d3a24f" stroke-opacity="0.85" stroke-width="2"/>
  <rect x="40" y="40" width="1120" height="670" fill="none" stroke="#d3a24f" stroke-opacity="0.4" stroke-width="1"/>

  <!-- paisley corner flourishes -->
  <g color="#d3a24f" opacity="0.75">
    <use href="#paisley" transform="translate(56 106) rotate(90) scale(1.8)"/>
    <use href="#paisley" transform="translate(1144 52) scale(-1 1) rotate(90) scale(1.8)"/>
    <use href="#paisley" transform="translate(56 644) scale(1.8)"/>
    <use href="#paisley" transform="translate(1144 698) scale(-1 1) scale(1.8)"/>
  </g>

  <!-- interlocked rings -->
  <g fill="none" stroke="url(#gold)" stroke-width="7">
    <circle cx="545" cy="310" r="115"/>
    <circle cx="655" cy="310" r="115" stroke-opacity="0.85"/>
  </g>
  <path d="M545 172 l16 18 -16 18 -16 -18 Z" fill="url(#gold)"/>
  <circle cx="655" cy="310" r="0" fill="none"/>

  <!-- monogram -->
  <text x="600" y="560" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="64" letter-spacing="18" fill="url(#gold)">A · M</text>
  <g stroke="#d3a24f" stroke-opacity="0.55" stroke-width="1.5" stroke-linecap="round">
    <line x1="380" y1="545" x2="470" y2="545"/>
    <line x1="730" y1="545" x2="820" y2="545"/>
  </g>

  <!-- flower sprigs flanking -->
  <g transform="translate(250 330)" fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-linejoin="round">
    <circle r="6"/>
    <path d="M0 -19 C-6 -29 -5 -40 0 -47 C5 -40 6 -29 0 -19 Z"/>
    <path d="M-19 0 C-29 6 -40 5 -47 0 C-40 -6 -29 -5 -19 0 Z"/>
    <path d="M19 0 C29 -6 40 -5 47 0 C40 6 29 6 19 0 Z"/>
    <path d="M0 19 C6 29 5 40 0 47 C-6 40 -6 29 0 19 Z"/>
  </g>
  <g transform="translate(950 330)" fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-linejoin="round">
    <circle r="6"/>
    <path d="M0 -19 C-6 -29 -5 -40 0 -47 C5 -40 6 -29 0 -19 Z"/>
    <path d="M-19 0 C-29 6 -40 5 -47 0 C-40 -6 -29 -5 -19 0 Z"/>
    <path d="M19 0 C29 -6 40 -5 47 0 C40 6 29 6 19 0 Z"/>
    <path d="M0 19 C6 29 5 40 0 47 C-6 40 -6 29 0 19 Z"/>
  </g>

  <!-- scattered florets -->
  <g fill="#d3a24f">
    <circle cx="330" cy="180" r="4" opacity="0.5"/><circle cx="870" cy="170" r="4" opacity="0.5"/>
    <circle cx="300" cy="520" r="3.5" opacity="0.45"/><circle cx="905" cy="515" r="3.5" opacity="0.45"/>
    <circle cx="470" cy="630" r="3" opacity="0.4"/><circle cx="740" cy="635" r="3" opacity="0.4"/>
  </g>
</svg>
