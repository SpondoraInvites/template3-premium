<svg xmlns="http://www.w3.org/2000/svg" width="720" height="960" viewBox="0 0 720 960" role="img" aria-label="Placeholder artwork — groom">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b130f"/>
      <stop offset="1" stop-color="#2b0a08"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7e5ab"/>
      <stop offset="0.4" stop-color="#e8c476"/>
      <stop offset="0.64" stop-color="#c9993f"/>
      <stop offset="1" stop-color="#a3762c"/>
    </linearGradient>
    <g id="paisley">
      <path d="M26 3 C34 8 38 17 36 26 C33.5 38 24 46 13.5 43 C4 40.5 0 30 5.5 21.5 C9.5 15.5 17 15 20.5 20 C18 15.5 20 9 26 3 Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M22 12 C15 17 12.5 25 16 31 C19 35.5 25 34 25 29 C25 25 21.5 24 20 26.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      <circle cx="29" cy="21" r="1.7" fill="currentColor"/><circle cx="13" cy="30" r="1.2" fill="currentColor"/>
    </g>
  </defs>

  <rect width="720" height="960" fill="url(#bg)"/>
  <rect x="26" y="26" width="668" height="908" fill="none" stroke="#d3a24f" stroke-opacity="0.85" stroke-width="2"/>
  <rect x="40" y="40" width="640" height="880" fill="none" stroke="#d3a24f" stroke-opacity="0.4" stroke-width="1"/>

  <!-- paisley corner flourishes -->
  <g color="#d3a24f" opacity="0.75">
    <use href="#paisley" transform="translate(52 108) rotate(90) scale(1.7)"/>
    <use href="#paisley" transform="translate(668 52) scale(-1 1) rotate(90) scale(1.7)"/>
    <use href="#paisley" transform="translate(52 852) scale(1.7)"/>
    <use href="#paisley" transform="translate(668 908) scale(-1 1) scale(1.7)"/>
  </g>

  <!-- sprig above the monogram -->
  <g fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round">
    <path d="M360 200 C356 240 356 268 360 296"/>
    <path d="M360 228 C340 222 328 208 326 190 C346 192 358 204 360 228 Z" fill="url(#gold)" stroke="none" opacity="0.9"/>
    <path d="M360 252 C380 246 392 232 394 214 C374 216 362 228 360 252 Z" fill="url(#gold)" stroke="none" opacity="0.9"/>
  </g>

  <!-- monogram -->
  <text x="360" y="560" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="330" fill="url(#gold)">A</text>
  <text x="360" y="640" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" letter-spacing="14" fill="#d3a24f" fill-opacity="0.8">GROOM</text>

  <!-- four-petal flower -->
  <g transform="translate(360 740)" fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-linejoin="round">
    <circle r="7"/>
    <path d="M0 -22 C-7 -33 -6 -45 0 -53 C6 -45 7 -33 0 -22 Z"/>
    <path d="M-22 0 C-33 7 -45 6 -53 0 C-45 -7 -33 -6 -22 0 Z"/>
    <path d="M22 0 C33 -7 45 -6 53 0 C45 7 33 6 22 0 Z"/>
    <path d="M0 22 C7 33 6 45 0 53 C-6 45 -7 33 0 22 Z"/>
  </g>

  <!-- scattered florets -->
  <g fill="#d3a24f">
    <circle cx="150" cy="500" r="4" opacity="0.5"/><circle cx="120" cy="620" r="3" opacity="0.4"/>
    <circle cx="580" cy="470" r="4" opacity="0.5"/><circle cx="612" cy="640" r="3" opacity="0.4"/>
    <circle cx="200" cy="820" r="3" opacity="0.4"/><circle cx="530" cy="830" r="3" opacity="0.4"/>
  </g>
</svg>
